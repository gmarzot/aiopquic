name: Interop

# QUIC Interop Runner matrices (hq-interop and WebTransport, qns/) against
# peer stacks, one job per pair and direction, h3spec against the qns HTTP/3
# server, a report job that charts the pairs (.github/scripts/interop_report.py),
# and the public-endpoint handshakes in tests/test_interop.py. Pull requests run
# the test cases only; scheduled and dispatched runs add the measurements. Peer
# and h3spec results are report-only; a case aiopquic runs failing against
# itself, or a pair or h3spec run that produced no results, fails the job.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  pull_request:
    paths:
      - "qns/**"
      - "!qns/**/*.md"
      - ".github/workflows/interop.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUNNER_REPO: quic-interop/quic-interop-runner
  RUNNER_REF: ab039a4a4b43ae2e21bb5704c9fad1f8fe6257d6
  H3SPEC_VERSION: v0.1.14
  H3SPEC_SHA256: 7f2e3232715a3f6ff5212d408b2a3e74d6aa3ca06f96efca9a4e5dc55f3c6860

jobs:
  wheel:
    name: wheel (cp312 manylinux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: pypa/cibuildwheel@v3.1.4
        env:
          CIBW_BUILD: cp312-manylinux_x86_64
          CIBW_ENVIRONMENT_PASS_LINUX: GITHUB_WORKSPACE
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-cp312
          path: wheelhouse/*.whl

  pairs:
    name: pairs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pairs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.RUNNER_REPO }}
          ref: ${{ env.RUNNER_REF }}
      - name: One pair per peer and direction, as the peer's runner role allows
        id: pairs
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          peers = {
              "quic": ["picoquic", "quic-go", "aioquic", "ngtcp2", "quiche"],
              "webtransport": ["webtransport-go", "ngtcp2", "xquic", "flupke-webtransport",
                               "chrome", "firefox"],
          }
          pairs = []
          for protocol, names in peers.items():
              roles = json.load(open(f"implementations_{protocol}.json"))
              pairs.append({"protocol": protocol, "server": "aiopquic", "client": "aiopquic"})
              for peer in names:
                  if roles[peer]["role"] in ("both", "client"):
                      pairs.append({"protocol": protocol, "server": "aiopquic", "client": peer})
                  if roles[peer]["role"] in ("both", "server"):
                      pairs.append({"protocol": protocol, "server": peer, "client": "aiopquic"})
          print("matrix=" + json.dumps({"include": pairs}))
          PY

  runner:
    name: ${{ matrix.protocol }} / ${{ matrix.server }} · ${{ matrix.client }}
    needs: [wheel, pairs]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.pairs.outputs.matrix) }}
    env:
      PROTOCOL: ${{ matrix.protocol }}
      SERVER: ${{ matrix.server }}
      CLIENT: ${{ matrix.client }}
      TESTS: ${{ github.event_name == 'pull_request' && '-t onlyTests' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.RUNNER_REPO }}
          ref: ${{ env.RUNNER_REF }}
          path: runner
      - uses: actions/download-artifact@v4
        with:
          name: wheel-cp312
          path: qns/wheelhouse
      # The runner needs docker engine >= 28.1.
      - uses: docker/setup-docker-action@v5
        with:
          version: version=v28.3.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tshark and runner dependencies
        run: |
          sudo modprobe ip6table_filter
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tshark
          pip install -r runner/requirements.txt
      - name: Build endpoint image
        run: docker build -t "aiopquic-$PROTOCOL:ci" --target "$PROTOCOL" qns
      - name: Register aiopquic with the runner
        working-directory: runner
        run: |
          f="implementations_$PROTOCOL.json"
          jq --arg image "aiopquic-$PROTOCOL:ci" '. + {aiopquic: {image: $image, url: "https://github.com/gmarzot/aiopquic", role: "both"}}' "$f" > "$f.new"
          mv "$f.new" "$f"
      - name: Run
        working-directory: runner
        env:
          CRON: "true"
        run: |
          mkdir -p ../results ../logs
          pair="${SERVER}_${CLIENT}"
          python run.py -p "$PROTOCOL" -s "$SERVER" -c "$CLIENT" $TESTS -l "../logs/$pair" -j "../results/$pair.json" 2>&1 | tee "../logs/$pair.txt" || true
      - name: Summarize
        if: always()
        run: |
          python - <<'PY'
          import glob, json, os, sys
          mark = {"succeeded": "✓", "failed": "✕", "unsupported": "?", None: "–"}
          protocol = os.environ["PROTOCOL"]
          expected = [f"{os.environ['SERVER']}_{os.environ['CLIENT']}"]
          found = {os.path.basename(p)[:-5]: json.load(open(p)) for p in sorted(glob.glob("results/*.json"))}
          errors = [f"{name}: no results" for name in expected if name not in found]
          lines = [f"### {protocol} / {expected[0]}", ""]
          for name, r in found.items():
              server, client = r["servers"][0], r["clients"][0]
              tests = r["results"][0]
              lines.append(f"**server {server} · client {client}**: " + " ".join(f"{t['name']} {mark[t['result']]}" for t in tests))
              for m in (r["measurements"][0] if r["measurements"] else []):
                  lines.append(f"- {m['name']}: {m['result']} {m['details']}")
              lines.append("")
              if server == client == "aiopquic":
                  failed = [t["name"] for t in tests if t["result"] == "failed"]
                  if failed:
                      errors.append(f"{name}: failed against itself: {', '.join(failed)}")
                  if not any(t["result"] == "succeeded" for t in tests):
                      errors.append(f"{name}: no case succeeded")
          lines += [f"- ERROR {e}" for e in errors]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          sys.exit(1 if errors else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interop-${{ matrix.protocol }}-${{ matrix.server }}_${{ matrix.client }}
          path: |
            results/
            logs/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.protocol }}-${{ matrix.server }}_${{ matrix.client }}
          path: results/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: report
    needs: runner
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Charts and matrices of every pair
        run: python .github/scripts/interop_report.py results

  h3spec:
    name: h3spec
    needs: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-cp312
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install aiopquic and h3spec
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install wheelhouse/aiopquic-*.whl
          gh release download "$H3SPEC_VERSION" -R kazu-yamamoto/h3spec -p h3spec-linux-x86_64
          echo "$H3SPEC_SHA256  h3spec-linux-x86_64" | sha256sum -c
          chmod +x h3spec-linux-x86_64
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 1 -subj /CN=localhost
          mkdir -p www && echo ok > www/index.html
      - name: Run h3spec against the qns HTTP/3 server
        run: |
          python - <<'PY'
          import asyncio, json, os, re, sys
          sys.path.insert(0, "qns")
          from endpoint import start_server

          async def run():
              server = await start_server(4433, "www", "cert.pem", "key.pem", "http3")
              try:
                  proc = await asyncio.create_subprocess_exec(
                      "./h3spec-linux-x86_64", "127.0.0.1", "4433", "-n",
                      stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.STDOUT)
                  out, _ = await proc.communicate()
              finally:
                  await server.aclose()
              return out.decode(errors="replace")

          # h3spec colors its output under GitHub Actions.
          out = re.sub(r"\x1b\[[0-9;]*m", "", asyncio.run(run()))
          open("h3spec.txt", "w").write(out)
          print(out)
          total = re.search(r"^(\d+) examples?, (\d+) failures?", out, re.M)
          failed = re.findall(r"^  \d+\) (.+)$", out.split("Failures:", 1)[-1], re.M) if total else []
          lines = [f"### h3spec {os.environ['H3SPEC_VERSION']}", ""]
          if total and int(total.group(1)) > 0:
              n, f = int(total.group(1)), int(total.group(2))
              # Status colors with icons; mid-gray text reads on light and dark.
              theme = {"pie1": "#0ca30c", "pie2": "#d03b3b", "pieTitleTextColor": "#8c959f",
                       "pieLegendTextColor": "#8c959f", "pieSectionTextColor": "#ffffff",
                       "pieStrokeColor": "#8c959f", "pieOuterStrokeColor": "#8c959f",
                       "pieOpacity": "1"}
              init = json.dumps({"theme": "base", "themeVariables": theme})
              lines += [f"{n - f} of {n} checks pass.", "", "```mermaid",
                        "%%{init: " + init + "}%%",
                        f"pie title h3spec {os.environ['H3SPEC_VERSION']}",
                        f'    "✅ pass {n - f}" : {n - f}', f'    "❌ fail {f}" : {f}', "```", "",
                        "<details><summary>Failing checks</summary>", ""]
              lines += [f"- ✕ {name}" for name in failed] + ["", "</details>"]
          else:
              lines.append("- ERROR h3spec produced no results")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          sys.exit(0 if total and int(total.group(1)) > 0 else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3spec
          path: h3spec.txt
          retention-days: 7

  public-endpoints:
    name: public endpoints
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/setup-aiopquic
        with:
          python-version: "3.12"
      - name: Handshake against public QUIC/H3 servers
        timeout-minutes: 10
        run: python -m pytest tests/test_interop.py -v -m interop
