name: CI

# PR + main test gate. Releases (TestPyPI -> PyPI -> GitHub Release) live
# in release.yml, triggered manually via workflow_dispatch.
#
# Tiers:
#   - core: unit + loopback. Required on (linux x86_64, linux aarch64, macos)
#     x (3.12, 3.13, 3.14).
#   - native: picoquic_ct + picohttp_ct subprocess smoke. Required.
#   - peer interop: qh3 + aioquic cross-stack transfers; aioquic WebTransport
#     stream teardown and reset. Required.
#   - sanitizers: core tier + Python peers on an ASan/UBSan build. Required.
#   - benchmark: perf floor on shared runners — advisory only
#     (continue-on-error); perf noise is not a correctness signal.

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt every job + every third-party action into the Node 24 runtime
# ahead of GitHub's 2026-06-02 hard cutover (Node 20 removed entirely
# 2026-09-16). One env beats per-action version cherry-picking and
# covers actions that haven't shipped a Node-24 release yet.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  core:
    name: core / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/setup-aiopquic
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run core tier
        timeout-minutes: 15
        run: python -m pytest tests/ -v -m "not interop and not native"

  native:
    name: picoquic / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/setup-aiopquic
        with:
          with-native-tests: 'true'
      - name: Run native tier
        timeout-minutes: 20
        run: python -m pytest tests/ -v -m native

  peer-interop:
    # aioquic + qh3 are pip-installable Python QUIC implementations. Each
    # test file spawns its peer as a subprocess (tests/interop/peers/): byte
    # exchange in both directions, and aioquic as a strict WebTransport peer.
    # Skipped silently in the core tier because aioquic/qh3 aren't in our dev
    # extras; this job installs them and runs those test files specifically.
    name: peer interop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/setup-aiopquic
      - name: Install Python QUIC peer stacks
        # qh3 is held below 2.0: that release rebuilt QuicConnection on a
        # Rust core and states its private internals are no longer
        # compatible. tests/interop/peers/qh3_echo.py monkeypatches the
        # private QuicConnectionProtocol._create_stream, so the peer needs
        # porting before the pin lifts. Unpinned, this job floats onto
        # every qh3 release and fails on their schedule, not ours.
        run: pip install aioquic 'qh3<2'
      - name: Run Python-peer interop tests
        timeout-minutes: 10
        run: |
          python -m pytest \
            tests/interop/test_aioquic.py \
            tests/interop/test_aioquic_wt.py \
            tests/interop/test_aioquic_close.py \
            tests/interop/test_qh3.py \
            -v --tb=short

  sanitizers:
    # picoquic, picotls and the extension built with ASan + UBSan.
    name: sanitizers (asan + ubsan)
    runs-on: ubuntu-latest
    env:
      SAN_FLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Capture submodule SHAs for cache key
        id: shas
        run: |
          echo "pico=$(git -C third_party/picoquic rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ptls=$(git -C third_party/picotls rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev
      - name: Cache sanitized picoquic build
        id: picoquic-cache
        uses: actions/cache@v4
        with:
          path: third_party/picoquic/build
          key: picoquic-build-san-${{ runner.os }}-${{ runner.arch }}-${{ steps.shas.outputs.pico }}-${{ steps.shas.outputs.ptls }}-${{ hashFiles('build.sh', 'patches/*.patch', '.github/workflows/cicd.yml') }}
      - name: Build picoquic with sanitizers
        if: steps.picoquic-cache.outputs.cache-hit != 'true'
        env:
          AIOPQUIC_WHEEL_BUILD: "1"
          PICOQUIC_C_FLAGS: ${{ env.SAN_FLAGS }}
          LDFLAGS: -fsanitize=address,undefined
        run: ./build.sh --native
      - name: Apply picoquic patches
        if: steps.picoquic-cache.outputs.cache-hit == 'true'
        run: ./build.sh --patches
      - name: Install Python QUIC peer stacks
        # qh3 held below 2.0, as in peer-interop.
        run: |
          python -m pip install --upgrade pip
          pip install aioquic 'qh3<2'
      - name: Install aiopquic with sanitizers
        env:
          CFLAGS: ${{ env.SAN_FLAGS }}
          LDFLAGS: -fsanitize=address,undefined
        run: pip install -e ".[dev]"
      - name: Run core tier and aioquic peers under sanitizers
        timeout-minutes: 20
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        # With aioquic and qh3 installed the core tier includes their peer
        # tests. Only the interpreter is preloaded. The 10 MB and 100 MB
        # peer transfers outrun their timeouts on a sanitized build.
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)" python -m pytest \
            tests/ -m "not interop and not native" \
            -k "not 10485760 and not 104857600" -v --tb=short

  # peer-interop-native retired: s2n-quic tests are deleted (unimplemented
  # stub) and every ngtcp2 directional test is an adapter-pending skip, so
  # the job built two native stacks per run for zero test signal. ngtcp2
  # remains an optional developer-machine peer (tests/interop/README.md);
  # picoquicdemo (vendored, h09 + h3/WT) is the planned in-tree native peer.

  benchmark:
    name: benchmark / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/setup-aiopquic
      - name: Run microbenches (latency + datagram + bulk + parallel)
        timeout-minutes: 8
        run: |
          # Four transport-level benches that complete deterministically
          # without the in-flight drain-tail issue bench_baselines_*
          # has on noisy hosted runners. All asserts run on FIN /
          # full-payload-received, never on a duration window.
          #
          #   - bench_latency_floor::test_bench_single_object_rtt:
          #     request/reply — RTT floor + p50/p99. User-facing media
          #     latency signal.
          #   - bench_datagram::test_bench_datagram_throughput:
          #     transport-level datagram path (100, 1000 datagrams).
          #     DATAGRAM frame send/recv path coverage.
          #   - bench_throughput::test_bench_stream_throughput:
          #     single-stream bulk send sweep [64KB, 1MB, 32MB].
          #     Reports Gb/s; asserts byte-exact delivery on FIN.
          #   - bench_throughput_parallel::test_bench_parallel_streams:
          #     N concurrent BIDI streams [4x1MB, 8x1MB, 16x256KB].
          #     Catches per-stream scheduling / fairness regressions
          #     the single-stream bench can't see.
          #
          # Floor enforcement deferred until hosted-runner noise is
          # calibrated across a few runs.
          python -m pytest \
            tests/bench/bench_latency_floor.py::test_bench_single_object_rtt \
            tests/bench/bench_datagram.py \
            tests/bench/bench_throughput.py \
            tests/bench/bench_throughput_parallel.py \
            -v -s --benchmark-disable
