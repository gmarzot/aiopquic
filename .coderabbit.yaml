# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  poem: false
  auto_review:
    enabled: true
    drafts: true
  path_filters:
    - "!third_party/**"
  path_instructions:
    - path: "src/aiopquic/_binding/c/**"
      instructions: >-
        Runs on the picoquic network thread; talks to asyncio through SPSC rings.
        Check RFC 9000 stream direction (RESET_STREAM only on streams we send on,
        STOP_SENDING only on streams we receive on), that nothing blocks or sleeps
        on the network thread, and that a stream context or link outlives every
        queued event that borrows it. Use picoquic's public API, not
        picoquic_internal.h.
    - path: "src/aiopquic/**/*.{py,pyx,pxd}"
      instructions: >-
        No synchronous waits or polling sleeps in product code; every wait is
        bounded by an event or by picoquic's own timers.
    - path: "tests/**"
      instructions: >-
        Every fix needs a test that fails without it. Flag tests that can pass
        vacuously, fixed sleeps that race on slow CI runners, and process-wide
        counters read without isolating earlier tests.
    - path: "**/*"
      instructions: >-
        Comments say what the code does or why a non-obvious choice is needed, in
        few words. Flag process narration, issue or PR references, and history in
        comments.
chat:
  auto_reply: true
